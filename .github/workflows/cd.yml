name: CD Pipeline - Continuous Delivery & Docker Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'

jobs:
  build_and_deploy:
    name: Build Docker Image & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smart-ocr-api
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: 🏗️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Trigger Deployment (Webhook / SSH Host)
        run: |
          echo "Image Docker construite et poussée avec succès !"
          echo "Déploiement déclenché sur l'environnement de production."
